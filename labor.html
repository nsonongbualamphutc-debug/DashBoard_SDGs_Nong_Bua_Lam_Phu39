<div id="tip"></div>
<div class="app" id="app">
  <header class="top" id="topbar"></header>
  <nav class="side" id="sidebar"></nav>
  <main class="main">
    <section class="view on" id="v-labor"></section>
  </main>
</div>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="ds.js"></script>
<script>
const QL=q=>'ไตรมาส '+q.n+'/'+q.y;
const LB={freq:'Q',key:null};
const LYEARS=()=>[...new Set(D.labor.quarters.map(q=>q.y))].sort((a,b)=>a-b);
function lbPeriods(){
  const Q=D.labor.quarters;
  if(LB.freq==='Q')return Q.map(q=>({k:q.q,label:QL(q),qs:[q]}));
  return LYEARS().map(y=>({k:'Y'+y,label:'ปี '+y,qs:Q.filter(q=>q.y===y)}));
}
function lbCur(){
  const ps=lbPeriods();
  if(!LB.key||!ps.find(p=>p.k===LB.key))LB.key=ps[ps.length-1].k;
  return ps.find(p=>p.k===LB.key);
}
function lbPrev(cur){
  const Q=D.labor.quarters;
  if(LB.freq==='Q'){
    const c=cur.qs[0], py=Q.find(q=>q.y===c.y-1&&q.n===c.n);
    return py?{label:QL(py),qs:[py]}:null;
  }
  const y=+cur.k.slice(1), qs=Q.filter(q=>q.y===y-1);
  return qs.length?{label:'ปี '+(y-1),qs}:null;
}
/* ค่าของงวด — จำนวนคนเป็นค่าสต๊อก จึงใช้ค่าเฉลี่ยของไตรมาสในปีนั้น */
function lbVal(p,key){
  if(!p||!p.qs.length)return null;
  const v=p.qs.map(q=>q[key]).filter(x=>x!=null);
  if(!v.length)return null;
  return LB.freq==='Q'?v[0]:v.reduce((a,b)=>a+b,0)/v.length;
}
function lbBar(){
  const ps=lbPeriods(), cur=lbCur(), ci=ps.indexOf(cur);
  return `<div class="slicer" id="lbSlicer">
    <span class="sl-lab"><img class="slico" src="assets/icons/ic-filter.png" alt="" onerror="this.remove()">เลือกงวดข้อมูล</span>
    <span class="sl-seg">
      <button data-lfq="Q" class="${LB.freq==='Q'?'on':''}">รายไตรมาส</button>
      <button data-lfq="Y" class="${LB.freq==='Y'?'on':''}">รายปี</button></span>
    <span class="sl-nav">
      <button data-lstep="-1" ${ci<=0?'disabled':''}><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <select data-lpick>${ps.map(p=>`<option value="${p.k}"${p.k===cur.k?' selected':''}>${p.label}</option>`).join('')}</select>
      <button data-lstep="1" ${ci>=ps.length-1?'disabled':''}><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </span>
    <button class="sl-now${ci===ps.length-1?' on':''}" data-lnow>ล่าสุด</button>
    <span class="sl-info">${LB.freq==='Q'?'ข้อมูลรายไตรมาส 12 งวด ตั้งแต่ '+QL(D.labor.quarters[0]):
      'รายปีใช้ค่าเฉลี่ยของไตรมาสในปีนั้น เพราะเป็นค่าสต๊อก ไม่ใช่ยอดสะสม'}</span>
  </div>`;
}
function bindLb(){
  const el=document.getElementById('lbSlicer'); if(!el||el.dataset.b)return;
  el.dataset.b='1';
  el.addEventListener('click',e=>{
    const fq=e.target.closest('[data-lfq]'), st=e.target.closest('[data-lstep]'), nw=e.target.closest('[data-lnow]');
    if(fq){LB.freq=fq.dataset.lfq;LB.key=null}
    else if(st){const ps=lbPeriods(),i=ps.findIndex(p=>p.k===LB.key);const n=ps[i+ +st.dataset.lstep];if(!n)return;LB.key=n.k}
    else if(nw){const ps=lbPeriods();LB.key=ps[ps.length-1].k}
    else return;
    renderLabor();
  });
  el.addEventListener('change',e=>{if(e.target.matches('[data-lpick]')){LB.key=e.target.value;renderLabor()}});
}

  const S=L.sectors, other=Math.max(0,L.secTotal-S.reduce((a,b)=>a+b[2],0));
  const sLab=S.map(r=>r[0].length>28?r[0].slice(0,27)+'…':r[0]).concat(other>0?['สาขาอื่น ๆ']:[]);
  const sVal=S.map(r=>r[2]).concat(other>0?[other]:[]);
  mk('cSec',{type:'doughnut',data:{labels:sLab,
    datasets:[{data:sVal,backgroundColor:PAL().concat(PAL()).slice(0,sVal.length),borderColor:cv('--card'),borderWidth:3}]},
    options:{cutout:'54%',plugins:{legend:{position:'bottom',labels:{padding:7,font:{size:9.5}}},
      tooltip:{callbacks:{label:c=>c.label+' '+f(c.raw,0)+' คน',
        footer:it=>'คิดเป็น '+(it[0].raw/L.secTotal*100).toFixed(1)+'% ของผู้มีงานทำ'}}}}});
  document.getElementById('tSec').innerHTML=`<thead><tr><th>สาขาเศรษฐกิจ</th><th class="r">คน</th><th class="r">สัดส่วน</th></tr></thead><tbody>`+
    S.map(r=>`<tr><td>${r[0]}</td><td class="r">${f(r[2],0)}</td><td class="r">${r[1].toFixed(1)}%</td></tr>`).join('')+
    `</tbody><tfoot><tr><td>ผู้มีงานทำทั้งหมด</td><td class="r">${f(L.secTotal,0)}</td><td class="r">100.0%</td></tr></tfoot>`;
  document.getElementById('secNote').innerHTML=
    `ภาคเกษตรกรรมจ้างงาน <b>${f(L.agri,0)} คน</b> (${(L.agri/L.secTotal*100).toFixed(1)}%)
     นอกภาคเกษตร <b>${f(L.nonagri,0)} คน</b> การจ้างงานจึงผูกกับฤดูกาลเพาะปลูกโดยตรง
     สาขาที่ใหญ่รองลงมาคือการค้าส่งค้าปลีก ซึ่งเป็นปลายทางของรายได้เกษตรกรอีกทอดหนึ่ง`;

  /* ── สถานภาพการทำงาน ── */
  const W=L.status, wTot=W.reduce((a,b)=>a+b[2],0);
  const informal=W.filter(r=>/ส่วนตัว|ครัวเรือน/.test(r[0])).reduce((a,b)=>a+b[1],0);
  document.getElementById('stBox').innerHTML=W.map((r,i)=>`<div class="barrow">
    <span class="nm">${r[0]}</span>
    <span class="tr"><i style="width:${(r[1]/W[0][1]*100).toFixed(0)}%;background:${PAL()[i%7]}"></i></span>
    <span class="vv">${r[1].toFixed(1)}%</span></div>`).join('');
  mk('cStatus',{type:'doughnut',data:{labels:['ทำงานส่วนตัวและช่วยธุรกิจครัวเรือน','ลูกจ้างเอกชนและรัฐบาล','นายจ้าง'],
    datasets:[{data:[
      W.filter(r=>/ส่วนตัว|ครัวเรือน/.test(r[0])).reduce((a,b)=>a+b[2],0),
      W.filter(r=>/ลูกจ้าง/.test(r[0])).reduce((a,b)=>a+b[2],0),
      W.filter(r=>/นายจ้าง/.test(r[0])).reduce((a,b)=>a+b[2],0)],
      backgroundColor:[cv('--coral'),cv('--brand'),cv('--gold')],borderColor:cv('--card'),borderWidth:3}]},
    options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{padding:9,font:{size:10}}},
      tooltip:{callbacks:{label:c=>c.label+' '+f(c.raw,0)+' คน',
        footer:it=>(it[0].raw/wTot*100).toFixed(1)+'% ของผู้มีงานทำ'}}}}});
  document.getElementById('stNote').innerHTML=
    `ผู้ทำงานส่วนตัวและช่วยธุรกิจครัวเรือนรวมกัน <b>${informal.toFixed(1)}%</b> ของผู้มีงานทำ
     คนกลุ่มนี้คือแรงงานนอกระบบโดยพฤตินัย ไม่มีเงินเดือนประจำ ไม่มีประกันสังคมจากนายจ้าง
     ขณะที่นายจ้างมีเพียง ${W.find(r=>/นายจ้าง/.test(r[0]))?W.find(r=>/นายจ้าง/.test(r[0]))[1].toFixed(1):'0'}%
     สะท้อนว่าจังหวัดยังขาดกิจการขนาดกลางที่จะดูดซับแรงงาน`;

  /* ── ทำงานต่ำกว่าระดับ ── */
  const U=L.under;
  mk('cUnder',{type:'bar',data:{labels:U.map(x=>'Q'+x.q.slice(-1)+'/'+x.q.slice(2,4)),
    datasets:[{label:'ผู้ทำงานต่ำกว่าระดับ (คน)',data:U.map(x=>x.v),
      backgroundColor:U.map(x=>x.v>30000?cv('--coral'):cv('--brand')),borderRadius:6,barPercentage:.7}]},
    options:{plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>f(c.raw,0)+' คน',
        footer:it=>'คิดเป็นราว '+(it[0].raw/last.emp*100).toFixed(0)+'% ของผู้มีงานทำปัจจุบัน'}}},
      scales:{x:ax({grid:{display:false},ticks:{font:{size:9.5}}}),y:ax({ticks:{callback:v=>f(v,0)}})}}});
  const uLast=U[U.length-1], uMax=U.reduce((a,b)=>b.v>a.v?b:a);
  document.getElementById('underNote').innerHTML=
    `ไตรมาสล่าสุดที่มีข้อมูลมีผู้ทำงานต่ำกว่าระดับ <b>${f(uLast.v,0)} คน</b>
     หรือราว ${(uLast.v/last.emp*100).toFixed(0)}% ของผู้มีงานทำ สูงกว่าจำนวนผู้ว่างงานหลายสิบเท่า
     นี่คือ “การว่างงานแฝง” ที่ตัวเลขอัตราการว่างงานมองไม่เห็น และเป็นกลุ่มเป้าหมายที่ตรงที่สุดของมาตรการเพิ่มรายได้`;

  /* ── ประกันสังคม ── */
  mk('cSso',{type:'line',data:{labels:MONTHS.map(m=>m.label),datasets:[
    {label:'มาตรา 33 (คน)',data:DB.social.m33.map(x=>x.v),borderColor:cv('--brand'),backgroundColor:cv('--brand')+'22',
      borderWidth:2.3,pointRadius:0,tension:.32,fill:true,yAxisID:'y'},
    {label:'มาตรา 40 (คน)',data:DB.social.m40.map(x=>x.v),borderColor:cv('--plum'),borderWidth:1.9,pointRadius:0,tension:.32,yAxisID:'y2'}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{padding:11}}},
      scales:{x:ax({grid:{display:false},ticks:{maxTicksLimit:12,font:{size:9.5}}}),
        y:ax({ticks:{callback:v=>f(v,0)}}),
        y2:{position:'right',grid:{display:false},border:{display:false},ticks:{callback:v=>f(v,0),font:{size:9.5}}}}}});

  applyEditMode();
}
DS.init('labor',renderLabor);
</script>
</body>
</html>
