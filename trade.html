<script>
function midOf(v){
  if(v==null||v==='—')return null;
  if(typeof v==='number')return v;
  const p=String(v).replace(/,/g,'').split(/[–-]/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
  return p.length?p.reduce((a,b)=>a+b,0)/p.length:null;
}
function chgChip(c){
  if(c==null)return '<span class="chip">—</span>';
  if(c===0)return '<span class="chip">◆ ทรงตัว</span>';
  return c>0?`<span class="chip up">▲ +${c}</span>`:`<span class="chip dn">▼ ${Math.abs(c)}</span>`;
}
function priceHtml(){
  const P=D.price;
  const up=[],dn=[];
  P.groups.forEach(g=>g.rows.forEach(r=>{if(r.chg>0)up.push(r.n);if(r.chg<0)dn.push(r.n)}));
  const nItem=P.groups.reduce((a,g)=>a+g.rows.length,0);
  const kpi=[
    kpiCard({icon:'cart',img:'inflation',color:cv('--brand'),label:'สินค้าที่ราคาสูงขึ้น',value:up.length,unit:'รายการ',
      chip:'<span class="chip up">'+(up[0]||'—')+'</span>',sub:'เทียบสัปดาห์ก่อน',
      tip:tipOf({t:'จำนวนสินค้าที่ราคาสูงขึ้น',
        d:'นับรายการสินค้าที่ราคาสัปดาห์นี้สูงกว่าสัปดาห์ก่อน เป็นสัญญาณค่าครองชีพที่เร็วที่สุดของจังหวัด เร็วกว่าดัชนีราคาผู้บริโภคที่ประกาศรายเดือน',
        calc:'นับรายการที่ผลต่างราคา (สัปดาห์นี้ − สัปดาห์ก่อน) > 0 จากสินค้าที่ติดตามทั้งหมด '+nItem+' รายการ',
        src:'cpi',when:'ประจำวันที่ '+P.asof})}),
    kpiCard({icon:'chart',img:'cpi',color:cv('--coral'),label:'สินค้าที่ราคาลดลง',value:dn.length,unit:'รายการ',
      chip:'<span class="chip dn">'+(dn[0]||'—')+'</span>',sub:'เทียบสัปดาห์ก่อน',
      tip:tipOf({t:'จำนวนสินค้าที่ราคาลดลง',
        d:'ราคาที่ลดลงช่วยผู้บริโภค แต่ถ้าเป็นสินค้าเกษตรจะกดรายได้เกษตรกรลงด้วย จึงต้องดูควบคู่กัน',
        calc:'นับรายการที่ผลต่างราคา (สัปดาห์นี้ − สัปดาห์ก่อน) < 0 จากสินค้าที่ติดตามทั้งหมด '+nItem+' รายการ',
        src:'cpi',when:'ประจำวันที่ '+P.asof})}),
    kpiCard({icon:'leaf',img:'rice',color:cv('--gold'),label:'ข้าวเปลือกหอมมะลิ',value:'17,000',unit:'บาท/ตัน',
      chip:chip(pctc(17000,14600)),sub:'เทียบปีก่อน 14,600 บาท/ตัน',
      tip:tipOf({t:'ราคาข้าวเปลือกหอมมะลิ',
        d:'ราคา ณ ลานรับซื้อในจังหวัด เงื่อนไขสีได้ต้นข้าว 36 กรัมขึ้นไป เป็นราคาที่กำหนดรายได้ของครัวเรือนปลูกข้าวโดยตรง',
        calc:'ราคารับซื้อที่สำรวจในสัปดาห์นี้ · เทียบปีก่อน = (17,000 − 14,600) ÷ 14,600 × 100',
        src:'cpi',when:'ประจำวันที่ '+P.asof})}),
    kpiCard({icon:'drop',img:'rubber',color:cv('--brand2'),label:'น้ำยางสด',value:'70–71',unit:'บาท/กก.',
      chip:chip(pctc(70.5,47.90)),sub:'เทียบปีก่อน 47.90 บาท/กก.',
      tip:tipOf({t:'ราคาน้ำยางสด',
        d:'ยางพาราเป็นพืชที่ราคาขยับขึ้นจากปีก่อนมากที่สุดของจังหวัด ช่วยหนุนรายได้เกษตรกรกลุ่มพืชไร่',
        calc:'ราคารับซื้อที่สำรวจในสัปดาห์นี้เป็นช่วง 70–71 บาท/กก. · เทียบปีก่อนใช้ค่ากลางของช่วง = (70.50 − 47.90) ÷ 47.90 × 100',
        src:'cpi',when:'ประจำวันที่ '+P.asof})})
  ].join('');
  const groups=P.groups.map(g=>`
    <div class="c mb"><header><span class="hdico icow img" data-hdico="cpi"></span><h3>${g.g}</h3><span class="u">หน่วย: ${g.unit}</span>
      <span class="r"><span class="owner">สำนักงานพาณิชย์จังหวัด</span></span></header>
      <div class="b"><div class="sc" style="max-height:420px">
        <table class="t" data-owner="cpi">
          <thead><tr><th>สินค้า</th><th class="r">สัปดาห์นี้</th><th class="r">สัปดาห์ก่อน</th>
            <th style="width:110px">เปลี่ยนแปลง</th><th class="r">${P.prevLabel}</th><th class="r">${P.yearLabel}</th><th class="r">%เทียบปีก่อน</th></tr></thead>
          <tbody>${g.rows.map(r=>{
            const a=midOf(r.now),b=midOf(r.yr);
            const tp=tipOf({t:r.n+(r.sub?' ('+r.sub+')':''),
              d:'หน่วย '+g.unit+' · ราคาที่สำรวจในตลาดของจังหวัด'+(r.chg?' · เปลี่ยนแปลงจากสัปดาห์ก่อน '+(r.chg>0?'+':'')+r.chg:' · ราคาทรงตัวจากสัปดาห์ก่อน'),
              calc:(a!=null&&b)?'เทียบปีก่อน = (ราคาสัปดาห์นี้ − ราคาปีก่อน) ÷ ราคาปีก่อน × 100 = ('+f_num(a)+' − '+f_num(b)+') ÷ '+f_num(b)+' × 100'+(typeof r.now==='string'&&/[–-]/.test(String(r.now))?' · ราคาที่รายงานเป็นช่วง จึงใช้ค่ากลางของช่วงในการเทียบ':''):'ยังไม่มีราคาปีก่อนให้เทียบ จึงแสดงเฉพาะราคาปัจจุบัน',
              src:'cpi',when:'ประจำวันที่ '+P.asof});
            return `<tr data-tip2="${tp}"><td>${rowIco(r.n)}${r.n}${r.sub?`<div style="font-size:10px;color:var(--faint);padding-left:26px">${r.sub}</div>`:''}</td>
              <td class="r" style="font-weight:600">${r.now}</td><td class="r">${r.prev}</td>
              <td>${chgChip(r.chg)}</td>
              <td class="r">${r.mo==null?'—':(typeof r.mo==='number'?f(r.mo,2):r.mo)}</td>
              <td class="r">${r.yr==null?'—':(typeof r.yr==='number'?f(r.yr,2):r.yr)}</td>
              <td class="r">${(a!=null&&b)?chip(pctc(a,b)):'—'}</td></tr>`}).join('')}</tbody>
        </table></div></div></div>`).join('');
  return `<div class="grid g4 mb">${kpi}</div>
    <div class="c mb"><header><span class="hdico icow img" data-hdico="compare"></span><h3>ราคาเทียบปีก่อน — สินค้าเกษตรหลัก</h3><span class="u">สเกลลอการิทึม</span></header>
      <div class="b"><div class="ch" style="height:330px"><canvas id="cPrice"></canvas></div>
      <div class="note">ยางพาราและมันสำปะหลังเป็นสองสินค้าที่ราคาขยับขึ้นจากปีก่อนมากที่สุด ขณะที่สินค้าปศุสัตว์ทรงตัว
      ราคาที่สูงขึ้นของยางและมันช่วยหนุนรายได้เกษตรกรในกลุ่มพืชไร่ ซึ่งเป็นฐานรายได้หลักของจังหวัด</div></div></div>
    ${groups}
    <div class="c"><header><span class="hdico icow img" data-hdico="source"></span><h3>หมายเหตุและช่องทางติดต่อ</h3></header>
      <div class="b" style="font-size:12.5px;color:var(--dim);line-height:1.8">
        <p style="margin-top:0">${P.note}</p>
        <p style="margin:0">ข้อมูล ณ วันที่ ${P.asof} · ${P.contact}</p>
        <div class="note">ราคารายสัปดาห์นี้เป็นตัวชี้ค่าครองชีพที่เร็วที่สุดของจังหวัด เร็วกว่าดัชนีราคาผู้บริโภคที่ประกาศรายเดือน
        จึงใช้เตือนล่วงหน้าได้ว่าเงินเฟ้อเดือนถัดไปจะขยับไปทางไหน</div>
      </div></div>`;
}
function renderPriceChart(){
  const items=[];
  D.price.groups.slice(0,2).forEach(g=>g.rows.forEach(r=>{
    const a=midOf(r.now),b=midOf(r.yr);
    if(a!=null&&b!=null)items.push({n:r.n+(r.sub?' ('+r.sub.slice(0,14)+')':''),now:a,yr:b});}));
  mk('cPrice',{type:'bar',data:{labels:items.map(x=>x.n),datasets:[
    {label:'ราคาปีก่อน',data:items.map(x=>x.yr),backgroundColor:cv('--line'),borderRadius:4,barPercentage:.82},
    {label:'ราคาสัปดาห์นี้',data:items.map(x=>x.now),backgroundColor:cv('--brand'),borderRadius:4,barPercentage:.82}]},
    options:{indexAxis:'y',plugins:{legend:{position:'bottom',labels:{padding:11}}},
      scales:{x:ax({type:'logarithmic',ticks:{callback:v=>f(v,0)}}),
              y:ax({grid:{display:false},ticks:{font:{size:10}}})}}});
}
function renderTradePage(){
  const v=document.getElementById('v-trade');
  renderSector('trade');
  const kids=[...v.children];
  const head=kids.shift();
  const wrap=document.createElement('div'); wrap.id='trade-idx';
  kids.forEach(k=>wrap.appendChild(k));
  const tabs=document.createElement('div'); tabs.className='segs'; tabs.id='tradeSeg';
  tabs.style.marginBottom='13px';
  tabs.innerHTML='<button class="on" data-t="idx">ดัชนีราคาและสินเชื่อ</button>'+
                 '<button data-t="price">ราคาสินค้ารายสัปดาห์</button>';
  v.appendChild(tabs); v.appendChild(wrap);
  const pr=document.createElement('div'); pr.id='trade-price'; pr.className='hide';
  pr.innerHTML=priceHtml(); v.appendChild(pr);
  bannerInto(pr,'assets/t-price.jpg','ราคาสินค้าเกษตรและอุปโภคบริโภครายสัปดาห์','สำนักงานพาณิชย์จังหวัดหนองบัวลำภู · ข้อมูล ณ 8 กันยายน 2569');
  const sb=document.createElement('div');sb.className='c';sb.style.marginTop='13px';
  sb.innerHTML='<header><span class="hdico icow img">'+icoImg('source',26)+'</span><h3>แหล่งข้อมูลและหน่วยงานผู้รับผิดชอบ</h3></header><div class="b">'+
    srcBar(['cpi','credit'],'ราคาสินค้าสำรวจรายสัปดาห์ ณ ลานรับซื้อและท้องตลาดทั่วไป · ข้อมูล ณ 8 กันยายน 2569')+'</div>';
  pr.appendChild(sb);
  renderPriceChart(); applyEditMode();
}
window.onSeg=function(w,btn){
  if(w.id==='tradeSeg'){
    document.getElementById('trade-idx').classList.toggle('hide',btn.dataset.t!=='idx');
    document.getElementById('trade-price').classList.toggle('hide',btn.dataset.t!=='price');
    return;
  }
  if(w.dataset.dom)drawSectorChart(w.dataset.dom,btn.dataset.mode);
};
DS.init('trade',renderTradePage);
</script>
</body>
</html>
